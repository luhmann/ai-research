# Quick Access - Recently Used Functions
# (This would require tracking usage, shown here as a concept)
[[cable_channel]]

[metadata]
name = "recent-functions"
description = "Recently used ZSH functions"
requirements = ["bat"]

[source]
command = '''
# This is a conceptual example
# In practice, you'd need to implement usage tracking
# For now, just show all functions sorted by modification time

if [ -z "$ZSH_FUNCTIONS_DIR" ]; then
  echo "Error: ZSH_FUNCTIONS_DIR not set"
  exit 1
fi

find "$ZSH_FUNCTIONS_DIR/functions" -type f 2>/dev/null -printf "%T@ %p\n" | \
  sort -rn | \
  head -20 | \
  while read -r timestamp func_file; do
    func_name=$(basename "$func_file")
    category=$(basename "$(dirname "$func_file")")
    description=$(grep "^# @description:" "$func_file" 2>/dev/null | head -1 | sed 's/^# @description: *//')

    printf "%-24s %-12s %-50s | %s\n" \
      "$func_name" \
      "[$category]" \
      "$description" \
      "$func_file"
  done
'''

[preview]
command = '''
file_path=$(echo "{}" | awk -F'|' '{print $NF}' | sed 's/^[[:space:]]*//')
bat --color=always --style=full --theme=base16 "$file_path" 2>/dev/null
'''
